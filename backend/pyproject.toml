[project]
name = "saas-backend"
version = "0.1.0"
description = "FastAPI backend for SaaS starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic[email]==2.9.2",
  "pydantic-settings==2.6.1",
  "SQLAlchemy==2.0.35",
  "alembic==1.13.2",
  "psycopg[binary]==3.2.3",
  "python-jose==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "httpx==0.27.2",
  "slowapi==0.1.9",
  "redis==5.0.0",
  "pytest==8.3.3",
  "pytest-order==1.2.1",
  "bcrypt==4.0.1",
  "email-validator==2.1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.alembic]
# (kept default)

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

